# Line coverage on every push to main and pull request, reported in the job
# summary and kept as an artifact. No external coverage service is needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Measure coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package"))
          covr::to_cobertura(cov)
          pct <- covr::percent_coverage(cov)
          by_file <- covr::tally_coverage(cov, by = "line")
          by_file <- aggregate(value ~ filename, data = transform(by_file, value = value > 0), FUN = mean)
          by_file <- by_file[order(by_file$value), ]
          lines <- c(sprintf("Line coverage: %.1f%%", pct), "",
                     "| File | Lines covered |", "|---|---|",
                     sprintf("| %s | %.1f%% |", by_file$filename, 100 * by_file$value))
          cat(lines, sep = "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
        shell: Rscript {0}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cobertura.xml
